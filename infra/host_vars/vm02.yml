interfaces:
  - dev: enp2s0
    addresses:
      - "10.1.0.2/24"
  - dev: enp3s0
    addresses:
      - "fd00:2::2/64"

sysctl_params:
  net.ipv4.ip_forward: "1"
  net.ipv6.conf.all.forwarding: "1"
  net.ipv6.conf.all.seg6_enabled: "1"
  net.ipv6.conf.enp3s0.seg6_enabled: "1"

ipv6_routes:
  - dest: "fd00:a:3::/48"
    via: "fd00:2::3"
    dev: enp3s0
  - dest: "fd00:a:4::/48"
    via: "fd00:2::3"
    dev: enp3s0
  - dest: "fd00:a:5::/48"
    via: "fd00:2::3"
    dev: enp3s0
  - dest: "fd00:a:7::/48"
    via: "fd00:2::3"
    dev: enp3s0

srv6_local_sids:
  - sid: "fd00:a:2::d4"
    nh4: "10.1.0.1"
    dev: enp2s0
