interfaces:
  - dev: enp2s0
    addresses:
      - "fd00:7::7/64"

sysctl_params:
  net.ipv6.conf.all.forwarding: "1"
  net.ipv6.conf.all.seg6_enabled: "1"
  net.ipv6.conf.enp2s0.seg6_enabled: "1"

ipv6_routes:
  - dest: "fd00:a:2::/48"
    via: "fd00:7::4"
    dev: enp2s0
  - dest: "fd00:a:3::/48"
    via: "fd00:7::4"
    dev: enp2s0
  - dest: "fd00:a:4::/48"
    via: "fd00:7::4"
    dev: enp2s0
  - dest: "fd00:a:5::/48"
    via: "fd00:7::4"
    dev: enp2s0

srv6_end_sids:
  - sid: "fd00:a:7::1"
    dev: enp2s0
