interfaces:
  - dev: enp2s0
    addresses:
      - "fd00:2::7/64"
  - dev: enp3s0
    addresses:
      - "fd00:7::7/64"

sysctl_params:
  net.ipv6.conf.all.forwarding: "1"
  net.ipv6.conf.all.seg6_enabled: "1"
  net.ipv6.conf.enp2s0.seg6_enabled: "1"
  net.ipv6.conf.enp3s0.seg6_enabled: "1"

ipv6_routes:
  - dest: "fd00:a:2::/48"
    via: "fd00:2::2"
    dev: enp2s0
  - dest: "fd00:a:3::/48"
    via: "fd00:7::3"
    dev: enp3s0
  - dest: "fd00:a:4::/48"
    via: "fd00:7::3"
    dev: enp3s0
  - dest: "fd00:a:6::/48"
    via: "fd00:7::3"
    dev: enp3s0
